#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Reverse proxies (Coolify / Traefik / Caddy): do NOT use host networking.
# Host mode takes the container off the proxy Docker network, which surfaces
# as HTTP 503 "no available server". Coolify should expose port 9119 and
# attach the FQDN to this `gateway` service. A non-loopback dashboard bind
# requires an auth provider or the dashboard fails closed at startup — set
# HERMES_DASHBOARD_BASIC_AUTH_USERNAME + _PASSWORD + _SECRET (or Nous OAuth)
# in the platform env, and HERMES_DASHBOARD_PUBLIC_URL to the public HTTPS
# origin (e.g. https://ai.vazler.cz).
#
# Security notes:
#   - The dashboard stores API keys. A public bind always requires auth;
#     HERMES_DASHBOARD_INSECURE is a no-op. Prefer Nous OAuth on the public
#     internet; basic auth is for a trusted LAN / VPN.
#   - If you override entrypoint, keep the image default
#     (`entrypoint-dispatch.sh`, which execs `/init` when it owns PID 1).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
# Coolify: do not add a `networks:` block. Coolify creates an isolated
# bridge named after the resource UUID and attaches Traefik to it. A
# second project network makes Traefik pick the wrong container IP
# (504 / "no available server"). Do not use network_mode: host either.
#
# If `docker compose up` fails with
#   ParseAddr("fdxx::1/64"): unexpected character, want colon
# that CIDR is Coolify's UUID network gateway, not this file. Docker
# Engine 27.x reports a new IPv6 gateway as CIDR until the daemon
# restarts (moby#49520). Fix it on the Coolify HOST — see
# scripts/fix_docker_ipv6_cidr_gateway.sh and docker.md "Coolify / Traefik".
#
services:
  gateway:
    build: .
    image: hermes-agent
    restart: unless-stopped
    expose:
      - "9119"
    ports:
      - "9119:9119"
    volumes:
      - ${HERMES_DATA:-~/.hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # Supervised dashboard in this same container (official image path).
      # A separate dashboard container needs host/PID namespace sharing;
      # that is incompatible with Coolify's reverse proxy.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_PUBLIC_URL=${HERMES_DASHBOARD_PUBLIC_URL:-}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      - HERMES_DASHBOARD_OAUTH_CLIENT_ID=${HERMES_DASHBOARD_OAUTH_CLIENT_ID:-}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]
